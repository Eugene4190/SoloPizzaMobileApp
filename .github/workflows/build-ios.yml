name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest # <--- ИЗМЕНЕНО НА САМЫЙ СВЕЖИЙ СЕРВЕР

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Patch Yoga.cpp
        run: |
          sed -i '' 's/ | / || /g' node_modules/react-native/ReactCommon/yoga/yoga/Yoga.cpp

      - name: Install Pods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (Unsigned)
        run: |
          cd ios
          xcodebuild -workspace *.xcworkspace -scheme SoloPizzaMobileApp -configuration Release -sdk iphoneos -arch arm64 -derivedDataPath ./build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_ENTITLEMENTS="" build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r ios/build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r SoloPizza.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoloPizza-iOS-Unsigned
          path: SoloPizza.ipa
